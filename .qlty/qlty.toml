# This configuration was generated with the setup-qlty-toml skill.
config_version = "0"

exclude_patterns = [
  "target/**",
  "src/site/**",
  "src/assembly/**",
]

[smells]
mode = "comment"

[language.java.smells]
function_complexity.threshold = 20
function_parameters.threshold = 6

# Required — points to the built-in Qlty plugin registry.
[[source]]
name = "default"
default = true

[[plugin]]
name = "trufflehog"
mode = "block"

[[plugin]]
name = "google-java-format"
mode = "comment"

[[plugin]]
name = "pmd"
mode = "monitor"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "yamllint"
mode = "comment"

[[plugin]]
name = "actionlint"
mode = "comment"

[[triage]]
plugins = ["pmd"]
rules = ["UselessParentheses"]
set.mode = "monitor"

[[triage]]
plugins = ["pmd"]
rules = ["AvoidInstantiatingObjectsJustToGetClass"]
set.mode = "monitor"
